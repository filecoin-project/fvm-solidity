[profile.default]
src = 'src'
test = 'test'
script = 'script'
out = 'out'
libs = ['lib']
cache_path = 'cache'
solc = "0.8.30"
optimizer = true
optimizer_runs = 200
via_ir = true

ignored_error_codes = [
    3628, # missing-receive-ether, see https://github.com/argotorg/solidity/issues/10159
]

# For dependencies
remappings = [
]

[lint]
severity = ["high", "med", "low", "info", "gas", "code-size"]
exclude_lints = [
    "custom-errors",
    "incorrect-shift",
    "mixed-case-function",
    "multi-contract-file",
    "unsafe-typecast",
]
